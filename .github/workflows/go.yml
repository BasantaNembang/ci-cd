name: Go

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'go-web-app/helm/**'
      - 'go-web-app/k8s/**'
      - 'go-web-app/README.md'
      - 'README.md'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.5'

    - name: Build
      run: |
        cd go-web-app
        go build -o go-web-app

    - name: Test
      run: |
        cd go-web-app
        go test ./...


  code-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: go-web-app

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        working-directory: go-web-app


  docker:
    needs: build

    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
       
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build & push Docker image
    - name: Build & Push Docker Image
      run: |
        cd go-web-app
        IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/go-web-app
        TAG=${GITHUB_SHA::7}
        
        docker build -t $IMAGE_NAME:$TAG .
        docker push $IMAGE_NAME:$TAG


  update-image-tag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: docker

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.REPO_TOKEN }}

    - name: Update tag in Helm chart
      run: |
        cd go-web-app
        TAG=${GITHUB_SHA::7}
        sed -i "s/tag:.*/tag: \"$TAG\"/" helm/myapp-chart/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "basanta@gmail.com"
        git config --global user.name "Basanta Nembang"
        git add helm/myapp-chart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push  
        

